# OTASEC | news sources.
#
# focus: ot      -> dedicated OT/ICS source; every item is kept (Claude still tags it)
# focus: broad   -> general security press; only items Claude marks as OT/ICS-relevant
#                   are published (keyword pre-filter when no API key is set)
# kind:  news | advisory | vendor
# lang:  language the source publishes in (en / nl)
# verified: date the feed URL was last confirmed to return a valid feed.
#           Feeds without a date were not reachable from the build environment
#           at setup time; check data/health.json after the first GitHub run.

feeds:
  # --- Dedicated OT / ICS --------------------------------------------------
  - id: industrialcyber
    name: Industrial Cyber
    url: https://industrialcyber.co/feed/
    focus: ot
    kind: news
    lang: en
    verified: 2026-10-14
  # SecurityWeek blocks GitHub's runners (HTTP 403, also with a bot User-Agent).
  # Its articles still arrive via X (securityweek.com is a trusted domain).
  - id: securityweek-ics
    name: SecurityWeek ICS/OT
    url: https://www.securityweek.com/category/ics-ot/feed/
    focus: ot
    kind: news
    lang: en
    enabled: false
  - id: securityaffairs-ics
    name: Security Affairs ICS-SCADA
    url: https://securityaffairs.com/category/security/ics-scada/feed
    focus: ot
    kind: news
    lang: en
    verified: 2026-10-14
  # cisa.gov blocks GitHub's runners, so CISA ICS advisories are read from
  # CISA's official CSAF repository on GitHub instead (see otasec/csaf.py).
  - id: cisa-ics
    name: CISA ICS Advisories
    type: cisa_csaf
    url: https://github.com/cisagov/CSAF
    repo: cisagov/CSAF
    branch: develop
    path: csaf_files/OT/white
    lookback_days: 7
    max_files: 40
    focus: ot
    kind: advisory
    lang: en
  - id: siemens-productcert
    name: Siemens ProductCERT
    url: https://cert-portal.siemens.com/productcert/rss/advisories.atom
    focus: ot
    kind: advisory
    lang: en
    verified: 2026-10-17   # publishes its full archive; old entries are dropped at ingest
  - id: waterfall
    name: Waterfall Security
    url: https://www.waterfall-security.com/feed/
    focus: ot
    kind: vendor
    lang: en
    verified: 2026-10-18
  - id: kaspersky-ics-cert
    name: Kaspersky ICS CERT
    url: https://ics-cert.kaspersky.com/feed/
    focus: ot
    kind: research
    lang: en
    verified: 2026-10-19
  # Listed on https://certvde.com/en/service/rss-feeds/ (German CERT for
  # industrial vendors: Phoenix Contact, WAGO, CODESYS, Beckhoff, Pilz, ...).
  - id: certvde
    name: CERT@VDE Advisories
    url: https://certvde.com/en/advisories/feeds/rss/
    focus: ot
    kind: advisory
    lang: en
  # OT.today (ISMG) has no public RSS feed of its own (checked Oct 2026);
  # its articles arrive via X (ot.today is a trusted domain below).
  # Dragos and Nozomi Networks no longer publish RSS feeds (404, Oct 2026).
  # Their research still reaches OTASEC through Industrial Cyber, SecurityWeek
  # and X (both domains are on the X allowlist below).
  - id: dragos
    name: Dragos
    url: https://www.dragos.com/feed/
    focus: ot
    kind: vendor
    lang: en
    enabled: false
  - id: nozomi
    name: Nozomi Networks
    url: https://www.nozominetworks.com/blog/rss.xml
    focus: ot
    kind: vendor
    lang: en
    enabled: false

  # --- Broad security press (filtered to OT/ICS) ---------------------------
  - id: thehackernews
    name: The Hacker News
    url: https://feeds.feedburner.com/TheHackersNews
    focus: broad
    kind: news
    lang: en
    verified: 2026-10-14
  - id: bleepingcomputer
    name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
    focus: broad
    kind: news
    lang: en
    verified: 2026-10-14
  - id: therecord
    name: The Record
    url: https://therecord.media/feed/
    focus: broad
    kind: news
    lang: en
    verified: 2026-10-14
  - id: helpnetsecurity
    name: Help Net Security
    url: https://www.helpnetsecurity.com/feed/
    focus: broad
    kind: news
    lang: en
    verified: 2026-10-14

  - id: ncsc-uk
    name: NCSC-UK
    url: https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml
    focus: broad
    kind: guidance
    lang: en
    verified: 2026-10-19

  # --- Dutch ------------------------------------------------------------------
  - id: ncsc-nl
    name: NCSC-NL Advisories
    url: https://advisories.ncsc.nl/rss/advisories
    focus: broad
    kind: advisory
    lang: nl
    verified: 2026-10-14
  - id: securitynl
    name: Security.NL
    url: https://www.security.nl/rss/headlines.xml
    focus: broad
    kind: news
    lang: nl
    verified: 2026-10-14

# X (Twitter) recent search, optional, needs X_BEARER_TOKEN.
# X API is pay-per-use (about $0.005 per post read in 2026), so this is
# deliberately throttled: at most `max_posts_per_run` posts every
# `min_interval_hours`, and `since_id` is tracked so the same post is
# never paid for twice.
x:
  # Disabled 22 Oct 2026: no clear added value yet. Set to true (and add the
  # X_BEARER_TOKEN secret back to the workflow) once there is a good use case.
  enabled: false
  min_interval_hours: 6
  max_posts_per_run: 50
  queries:
    - id: keywords
      query: >-
        ("ICS security" OR "OT security" OR SCADA OR "operational technology"
        OR "IEC 62443" OR "industrial control" OR PLC vulnerability)
        has:links -is:retweet -is:reply lang:en
  # Optional: accounts to follow, e.g. ["CISAgov", "SecurityWeek"].
  # Added as a second query: (from:a OR from:b) has:links -is:retweet
  accounts: []
  # X links only become new items when they point to one of these domains
  # (subdomains included) or to a domain our RSS feeds already link to.
  # Everything else only counts as a "shared on X" signal for known articles.
  trusted_domains:
    # Government, CERTs, standards bodies
    - cisa.gov
    - nist.gov
    - ncsc.nl
    - ncsc.gov.uk
    - digitaltrustcenter.nl
    - enisa.europa.eu
    - cert.europa.eu
    - bsi.bund.de
    - cert.ssi.gouv.fr
    - certvde.com
    - isa.org
    - isagca.org
    - iec.ch
    - energy.gov
    - epa.gov
    # OT security vendors and research labs
    - dragos.com
    - nozominetworks.com
    - claroty.com
    - armis.com
    - forescout.com
    - tenable.com
    - txone.com
    - waterfall-security.com
    - mandiant.com
    - cloud.google.com
    - unit42.paloaltonetworks.com
    - microsoft.com
    - blog.talosintelligence.com
    - ics-cert.kaspersky.com
    - kaspersky.com
    - welivesecurity.com
    - trendmicro.com
    - sans.org
    - siemens.com
    - se.com
    - rockwellautomation.com
    # News
    - industrialcyber.co
    - ot.today
    - securityweek.com
    - therecord.media
    - darkreading.com
    - cyberscoop.com
    - theregister.com
    - arstechnica.com
    - wired.com
    - reuters.com
    - apnews.com
    - bloomberg.com
    - ft.com
    - controlglobal.com
    - automationworld.com
    - controleng.com
    - utilitydive.com
    - nos.nl
    - tweakers.net
    - computable.nl
    - fd.nl
  # Hosts under a trusted domain that must NOT introduce items (anyone can
  # publish there). Forum, community, Q&A and user-storage subdomains
  # (community.*, forum.*, answers.*, storage.*, ...) are already excluded in
  # code; list further ones here, e.g. a vendor's user blog platform.
  untrusted_hosts: []
  # Readable names for X-sourced items from sites without their own feed here.
  display_names:
    securityweek.com: SecurityWeek
    nist.gov: NIST
    cisa.gov: CISA
    ot.today: OT.today
    dragos.com: Dragos
    nozominetworks.com: Nozomi Networks
    claroty.com: Claroty
    forescout.com: Forescout
    armis.com: Armis
    tenable.com: Tenable
