  name:
    en: LockerGoga at Norsk Hydro
    nl: LockerGoga bij Norsk Hydro
  place: {en: "Oslo, Norway, and plants worldwide", nl: "Oslo, Noorwegen, en fabrieken wereldwijd"}
  lat: 59.91
  lon: 10.75
  continent: europe
  sector: manufacturing
  impact: disruption
  status: confirmed
  actor: {en: "LockerGoga ransomware operators", nl: "Operators van LockerGoga-ransomware"}
  malware: [LockerGoga]
  summary:
    en: Ransomware encrypted Norsk Hydro's IT systems worldwide. Several extrusion plants switched to manual operation while smelters kept running. Hydro refused to pay and was praised for its open communication; the cost ran to hundreds of millions of Norwegian kroner.
    nl: Ransomware versleutelde wereldwijd de IT-systemen van Norsk Hydro. Meerdere extrusiefabrieken gingen over op handbediening, terwijl de smelterijen doordraaiden. Hydro betaalde niet en kreeg lof voor de open communicatie; de schade liep op tot honderden miljoenen Noorse kronen.
  lesson:
    en: Practised manual operation and transparent crisis communication kept the business going.
    nl: Geoefende handbediening en open crisiscommunicatie hielden het bedrijf draaiende.
  sources:
    - {title: "TechCrunch: Norsk Hydro shut down by ransomware", url: "https://techcrunch.com/2019/03/19/norsk-hydro-ransomware/embed/"}
    - {title: "AL Circle: Hydro's aluminium operations affected", url: "https://www.alcircle.com/news/hydros-aluminium-operations-affected-after-extensive-cyber-attack-44458"}

