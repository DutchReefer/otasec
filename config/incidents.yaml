- id: oldsmar-2021
  date: "2021-02-05"
  name:
    en: Oldsmar water treatment
    nl: Waterzuivering in Oldsmar
  place: {en: "Oldsmar, Florida, US", nl: "Oldsmar, Florida, VS"}
  lat: 28.03
  lon: -82.66
  continent: north_america
  sector: water
  impact: process
  status: disputed
  actor: {en: "Disputed: first reported as a remote intruder; the former city manager said in 2023 it was most likely employee error", nl: "Betwist: eerst gemeld als indringer op afstand; de voormalige stadsmanager zei in 2023 dat het waarschijnlijk een fout van een medewerker was"}
  summary:
    en: Officials said someone used remote desktop software to raise the sodium hydroxide setpoint from 100 to 11,100 ppm, which an operator reversed at once. In 2023 the former city manager said the FBI had concluded it was most likely an employee error. Either way, a shared password, no firewall and an unsupported operating system were found.
    nl: Volgens de autoriteiten zette iemand via remote-desktopsoftware het setpoint voor natronloog van 100 naar 11.100 ppm, wat een operator direct terugdraaide. In 2023 zei de voormalige stadsmanager dat de FBI concludeerde dat het waarschijnlijk een fout van een medewerker was. Hoe dan ook bleken er een gedeeld wachtwoord, geen firewall en een niet meer ondersteund besturingssysteem te zijn.
  lesson:
    en: Remote access tools on HMIs and shared credentials are a risk whatever the cause. Log enough to tell an attack from a mistake.
    nl: Remote-accesstools op HMI's en gedeelde inloggegevens zijn hoe dan ook een risico. Log genoeg om een aanval van een vergissing te onderscheiden.
  sources:
    - {title: "Water Online: Former official claims Oldsmar hack was operator error", url: "https://www.wateronline.com/doc/former-official-claims-oldsmar-drinking-water-hack-was-really-operator-error-0001"}
    - {title: "Route Fifty: Florida water incident allegedly caused by employee error", url: "https://route-fifty.com/cybersecurity/2023/03/florida-city-water-cyber-incident-allegedly-caused-employee-error/384267"}

