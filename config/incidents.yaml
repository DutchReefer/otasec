- id: gas-compression-2020
  date: "2020-02"
  name:
    en: Ransomware stops a gas pipeline
    nl: Ransomware legt een gaspijpleiding stil
  place: {en: "United States (site not disclosed)", nl: "Verenigde Staten (locatie niet bekendgemaakt)"}
  lat: 37.0
  lon: -95.5
  continent: north_america
  sector: oil_gas
  impact: disruption
  status: confirmed
  actor: {en: "Unknown ransomware operators", nl: "Onbekende ransomware-operators"}
  summary:
    en: Ransomware entered a natural gas compression facility through spear-phishing and spread from IT into OT, encrypting HMIs, historians and polling servers. The operator shut the facility and, because of dependencies, the entire pipeline for about two days. Its emergency plan had no cyber scenarios.
    nl: Ransomware kwam via spearphishing binnen bij een gascompressorstation en verspreidde zich van IT naar OT, waar HMI's, historians en pollingservers werden versleuteld. De beheerder legde het station en door afhankelijkheden de hele pijpleiding ongeveer twee dagen stil. Het noodplan bevatte geen cyberscenario's.
  lesson:
    en: Add cyber scenarios to emergency response plans and map IT and OT dependencies between sites.
    nl: Neem cyberscenario's op in noodplannen en breng afhankelijkheden tussen IT, OT en locaties in kaart.
  sources:
    - {title: "Sophos: Ransomware forces 2-day shutdown of natural gas pipeline", url: "https://www.sophos.com/en-us/blog/ransomware-attack-forces-2-day-shutdown-of-natural-gas-pipeline"}
    - {title: "RISI database entry", url: "https://www.risidata.com/Database/Detail/natural-gas-compression-facility-ransomware-2020"}

- id: israel-water-2020
  date: "2020-04-24"
  name:
    en: Attempt to alter chlorine at Israeli water plants
    nl: Poging tot aanpassen van chloor bij Israëlische waterbedrijven
  place: {en: "Israel", nl: "Israël"}
  lat: 32.0
  lon: 34.9
  continent: asia
  sector: water
  impact: intrusion
  status: confirmed
  actor: {en: "Iran, according to Israeli and Western officials quoted in media", nl: "Iran, volgens Israëlische en westerse functionarissen in de media"}
  summary:
    en: Attackers accessed control systems at several water and wastewater facilities. Media reports said they tried to change chlorine dosing; Israeli authorities said the attempts were stopped without impact on the water supply.
    nl: Aanvallers kwamen in besturingssystemen van meerdere drink- en afvalwaterinstallaties. Volgens media probeerden ze de chloordosering te wijzigen; de Israëlische autoriteiten meldden dat de pogingen zonder gevolgen voor de watervoorziening werden gestopt.
  lesson:
    en: Limit setpoint ranges in the controller itself, so a remote user cannot push a dose to a dangerous value.
