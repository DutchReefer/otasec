- id: pdvsa-2025
  date: "2025-12-13"
  name:
    en: Ransomware at PDVSA
    nl: Ransomware bij PDVSA
  place: {en: "Caracas, Venezuela", nl: "Caracas, Venezuela"}
  lat: 10.48
  lon: -66.9
  continent: south_america
  sector: oil_gas
  impact: disruption
  status: reported
  actor: {en: "Unknown; PDVSA blamed foreign interests", nl: "Onbekend; PDVSA gaf buitenlandse belangen de schuld"}
  summary:
    en: A ransomware attack and the clean-up that followed took down the state oil company's administrative systems. A company source told Reuters cargo deliveries had stopped, while PDVSA said production and exports were not affected.
    nl: Een ransomwareaanval en de opschoning daarna legden de administratieve systemen van het staatsoliebedrijf plat. Een bron binnen het bedrijf zei tegen Reuters dat leveringen stillagen, terwijl PDVSA verklaarde dat productie en export niet waren geraakt.
  lesson:
    en: Clean-up can be as disruptive as the attack. Prepare an isolation plan that keeps operations running.
    nl: Opschonen kan net zo ontwrichtend zijn als de aanval. Bereid een isolatieplan voor dat de operatie laat doordraaien.
  sources:
    - {title: "Security Affairs: Cyber attack hit PDVSA, disrupting export operations", url: "https://securityaffairs.com/185755/security/a-cyber-attack-hit-petroleos-de-venezuela-pdvsa-disrupting-export-operations.html"}

- id: poland-energy-2025
  date: "2025-12-29"
  name:
    en: Destructive attack on Polish energy sites
    nl: Destructieve aanval op Poolse energielocaties
  place: {en: "Poland (more than 30 wind and solar farms, a CHP plant)", nl: "Polen (ruim 30 wind- en zonneparken, een wkk-centrale)"}
  lat: 52.1
  lon: 19.4
  continent: europe
  sector: energy
  impact: process
  status: confirmed
  actor: {en: "Russia-linked: CERT Polska saw overlap with the Berserk Bear / Static Tundra cluster; ESET attributed it to Sandworm with medium confidence", nl: "Gelinkt aan Rusland: CERT Polska zag overlap met het cluster Berserk Bear / Static Tundra; ESET schreef het met middelmatige zekerheid toe aan Sandworm"}
  malware: [DynoWiper]
  summary:
    en: Coordinated attacks hit more than 30 wind and solar farms, a large combined heat and power plant serving almost half a million customers, and a manufacturer. At the farms the attackers damaged RTU firmware and wiped HMIs, cutting remote control by the grid operator while generation continued. At the CHP plant EDR blocked the wiper.
    nl: Gecoördineerde aanvallen troffen ruim 30 wind- en zonneparken, een grote wkk-centrale die bijna een half miljoen klanten van warmte voorziet, en een maakbedrijf. Bij de parken beschadigden de aanvallers RTU-firmware en wisten ze HMI's, waardoor de netbeheerder ze niet meer op afstand kon bedienen; de opwek ging door. Bij de wkk-centrale hield EDR de wiper tegen.
  lesson:
    en: Distributed renewable sites are now targets for destructive attacks. Harden remote access and keep firmware recovery images for RTUs and relays.
    nl: Verspreide duurzame locaties zijn nu doelwit van destructieve aanvallen. Versterk toegang op afstand en houd herstelimages van firmware voor RTU's en beveiligingsrelais bij de hand.
  sources:
    - {title: "CERT Polska: Incident report energy sector 2025", url: "https://cert.pl/en/posts/2026/01/incident-report-energy-sector-2025/"}
    - {title: "Help Net Security: Poland repels data-wiping malware attack", url: "https://www.helpnetsecurity.com/2026/01/26/poland-energy-malware-attack/"}

- id: mackay-sugar-2026
  date: "2026-06-10"
  name:
    en: Mackay Sugar mills
    nl: Suikerfabrieken van Mackay Sugar
  place: {en: "Mackay, Queensland, Australia", nl: "Mackay, Queensland, Australië"}
  lat: -21.14
  lon: 149.19
  continent: oceania
  sector: food
  impact: disruption
  status: confirmed
  actor: {en: "The Gentlemen ransomware (claimed)", nl: "The Gentlemen-ransomware (opgeëist)"}
  summary:
    en: Ransomware took down the systems that coordinate cane supply, harvesting and mill intake during the crushing season. Mills stopped accepting cane; one restarted limited manual crushing two days later.
    nl: Ransomware legde midden in het oogstseizoen de systemen plat die rietaanvoer, oogst en inname bij de fabrieken coördineren. De fabrieken namen geen riet meer aan; één ervan hervatte twee dagen later beperkt en handmatig.
  lesson:
    en: Seasonal operations have no slack. Test the manual fallback before the season starts.
    nl: Seizoensgebonden bedrijven hebben geen speling. Test de handmatige terugval voordat het seizoen begint.
  sources:
