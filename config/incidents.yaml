- id: collins-muse-2025
  date: "2025-09-19"
  name:
    en: Airport check-in systems down across Europe
    nl: Incheck-systemen op Europese luchthavens plat
  place: {en: "Brussels, London Heathrow, Berlin and other airports", nl: "Brussel, Londen Heathrow, Berlijn en andere luchthavens"}
  lat: 50.9
  lon: 4.48
  continent: europe
  sector: transport
  impact: disruption
  status: confirmed
  actor: {en: "Ransomware, confirmed by ENISA; no group named", nl: "Ransomware, bevestigd door ENISA; geen groep genoemd"}
  summary:
    en: Ransomware hit Collins Aerospace's MUSE shared check-in and boarding system. Brussels, Heathrow, Berlin and other airports fell back to manual check-in for days, and Brussels Airport cancelled many flights.
    nl: Ransomware trof MUSE, het gedeelde incheck- en boardingsysteem van Collins Aerospace. Brussel, Heathrow, Berlijn en andere luchthavens moesten dagenlang handmatig inchecken en Brussels Airport schrapte veel vluchten.
  lesson:
    en: Shared platforms concentrate risk. Map which operational processes depend on a single supplier.
    nl: Gedeelde platforms concentreren risico. Breng in kaart welke operationele processen van één leverancier afhangen.
  sources:
    - {title: "TechCrunch: EU cyber agency confirms ransomware behind airport disruptions", url: "https://techcrunch.com/2025/09/22/eu-cyber-agency-confirms-ransomware-attack-causing-airport-disruptions/"}
    - {title: "Airport Technology: European airports hit by Collins Aerospace attack", url: "https://www.airport-technology.com/newsletters/three-european-airports-hit-by-collins-aerospace-cyberattack"}

- id: asahi-2025
  date: "2025-09-29"
  name:
    en: Asahi breweries halted
    nl: Brouwerijen van Asahi stilgelegd
  place: {en: "Japan", nl: "Japan"}
  lat: 35.71
  lon: 139.8
  continent: asia
  sector: food
  impact: disruption
  status: confirmed
  actor: {en: "Qilin ransomware (claimed)", nl: "Qilin-ransomware (opgeëist)"}
  malware: [Qilin]
  summary:
    en: Ransomware took down order and shipping systems at Asahi Group, forcing its breweries in Japan to stop or cut production and causing shortages of its beer. Orders were handled manually for weeks.
    nl: Ransomware legde de order- en verzendsystemen van Asahi Group plat, waardoor de brouwerijen in Japan de productie moesten stoppen of verminderen en er tekorten aan bier ontstonden. Bestellingen werden wekenlang handmatig verwerkt.
  lesson:
    en: Production stops when orders and logistics stop. Treat those IT systems as part of the operational chain.
    nl: Productie stopt als orders en logistiek stoppen. Behandel die IT-systemen als onderdeel van de operationele keten.
  sources:
