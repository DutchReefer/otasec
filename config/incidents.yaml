    nl: Verstoring in de haven Shahid Rajaee
  place: {en: "Bandar Abbas, Iran", nl: "Bandar Abbas, Iran"}
  lat: 27.1
  lon: 56.06
  continent: asia
  sector: transport
  impact: disruption
  status: reported
  actor: {en: "Israel, according to officials quoted by The Washington Post", nl: "Israël, volgens functionarissen geciteerd door The Washington Post"}
  summary:
    en: A cyberattack on the computer systems that coordinate ship and truck traffic at Iran's main container port caused days of congestion. Reports linked it to retaliation for the attempted attack on Israeli water systems two weeks earlier.
    nl: Een cyberaanval op de systemen die schepen en vrachtverkeer in de grootste containerhaven van Iran regelen, zorgde dagenlang voor opstoppingen. Berichten koppelden de aanval aan vergelding voor de poging op Israëlische watersystemen twee weken eerder.
