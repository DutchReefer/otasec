    en: Ransomware hit Colonial Pipeline's IT network through a VPN account without multi-factor authentication. As a precaution the company shut down the 8,850 km fuel pipeline for about five days, causing shortages on the US East Coast. OT itself was not encrypted.
    nl: Ransomware trof het IT-netwerk van Colonial Pipeline via een VPN-account zonder meerfactorauthenticatie. Uit voorzorg legde het bedrijf de 8.850 km lange brandstofleiding ongeveer vijf dagen stil, met tekorten aan de Amerikaanse oostkust tot gevolg. OT zelf werd niet versleuteld.
