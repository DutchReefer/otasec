- id: us-water-campaign-2026
  date: "2026-07-26"
  name:
    en: PLC attacks on US water systems
    nl: PLC-aanvallen op Amerikaanse waterbedrijven
  place: {en: "Minnesota and at least 11 other US states", nl: "Minnesota en minstens 11 andere Amerikaanse staten"}
  lat: 45.72
  lon: -93.17
  continent: north_america
  sector: water
  impact: disruption
  status: reported
  actor: {en: "Suspected CyberAv3ngers (Iran-linked), per US officials quoted in media; not formally attributed", nl: "Vermoedelijk CyberAv3ngers (gelinkt aan Iran), volgens Amerikaanse functionarissen in de media; niet formeel toegeschreven"}
  summary:
    en: Attackers changed passwords and IP settings on internet-facing PLCs and HMIs at more than 30 Minnesota water systems, cutting monitoring and control and forcing some to manual operation. Utilities in at least 12 states reported similar incidents within weeks; water quality in Minnesota was not affected.
    nl: Aanvallers wijzigden wachtwoorden en IP-instellingen van via internet bereikbare PLC's en HMI's bij ruim 30 waterbedrijven in Minnesota, waardoor monitoring en bediening wegvielen en sommige overgingen op handbediening. Binnen enkele weken meldden waterbedrijven in minstens 12 staten vergelijkbare incidenten; de waterkwaliteit in Minnesota bleef goed.
  lesson:
    en: Three years after Aliquippa, exposed PLCs were still the way in. Remove direct internet exposure.
    nl: Drie jaar na Aliquippa waren blootgestelde PLC's nog steeds de ingang. Haal directe internetblootstelling weg.
  sources:
    - {title: "SecureWorld: Coordinated cyberattack on Minnesota's water systems", url: "https://www.secureworld.io/industry-news/cyberattack-taps-minnesota-water"}
    - {title: "Daily Security Review: Water sector attacks hit 12 states", url: "https://dailysecurityreview.com/threat-actors/us-water-sector-attacks-hit-12-states-georgia-confirmed/"}

- id: atns-2026
  date: "2026-09"
  name:
    en: Malware in air navigation OT
    nl: Malware in OT van de luchtverkeersleiding
  place: {en: "Gqeberha (Port Elizabeth), South Africa", nl: "Gqeberha (Port Elizabeth), Zuid-Afrika"}
  lat: -33.98
  lon: 25.61
  continent: africa
  sector: transport
  impact: intrusion
  status: reported
  actor: {en: "Unknown", nl: "Onbekend"}
  summary:
    en: South Africa's air navigation service provider ATNS investigated ransomware-linked malware in OT environments supporting weather services at Port Elizabeth and possibly other airports, with signs of data sent abroad. No flight disruption was reported.
    nl: De Zuid-Afrikaanse luchtverkeersdienstverlener ATNS onderzocht ransomware-gerelateerde malware in OT-omgevingen voor weerdiensten op de luchthaven van Port Elizabeth en mogelijk andere luchthavens, met aanwijzingen dat data naar het buitenland ging. Er werden geen vluchtverstoringen gemeld.
  lesson:
    en: Supporting systems such as weather feeds are part of safety-critical operations. Include them in OT monitoring.
    nl: Ondersteunende systemen zoals weerdata horen bij veiligheidskritieke operaties. Neem ze mee in OT-monitoring.
  sources:
    - {title: "SC Media: South African air traffic firm investigates malware in OT network", url: "https://www.scworld.com/brief/south-african-air-traffic-control-firm-investigates-ransomware-linked-malware-in-ot-network"}
