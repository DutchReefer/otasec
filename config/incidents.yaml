# OTASEC | OT incident history (the /incidents/ page on otasec.com and otasec.nl).
#
# Curated by hand: landmark incidents where operational technology was hit,
# disrupted or deliberately targeted, from the Sandworm era (2008) onwards.
# Summaries are our own words; every entry links to its sources.
#
# Fields
#   id         unique slug (also the URL anchor: /incidents/#<id>)
#   date       "YYYY-MM-DD", "YYYY-MM" or "YYYY" (when it happened or, if
#              unknown, when it was disclosed)
#   place      {en, nl} shown under the title
#   lat, lon   blip position; for undisclosed sites use the country centre
#              and say so in `place`
#   continent  europe | asia | north_america | south_america | africa | oceania
#              (the Middle East counts as Asia, Turkey and Cyprus too)
#   sector     a key from i18n STRINGS["sectors"]
#   impact     process     the physical process or equipment was manipulated or damaged
#              disruption  operations stopped or degraded
#              intrusion   access, espionage or a foiled attack, no operational effect
#   status     confirmed | reported (single or unofficial source) | disputed
#   actor      {en, nl} attribution as stated by the named source, or "Unknown"
#   malware    list of named tools (optional)
#   name, summary, lesson   {en, nl}
#   sources    list of {title, url}; https only, checked by tests
#
# House style: no em dashes; plain, factual wording; attribution only as
# claimed by governments, CERTs or named researchers.

- id: lodz-tram-2008
  date: "2008-01"
  name:
    en: Łódź tram network
    nl: Trams in Łódź
  place: {en: "Łódź, Poland", nl: "Łódź, Polen"}
  lat: 51.76
  lon: 19.46
  continent: europe
  sector: transport
  impact: process
  status: confirmed
  actor: {en: "A 14-year-old local student", nl: "Een 14-jarige scholier uit de stad"}
  summary:
    en: A teenager modified a TV remote control to switch the infrared-operated track points of the city's tram network. Four trams derailed and twelve people were injured.
    nl: Een tiener bouwde een tv-afstandsbediening om waarmee hij de infraroodgestuurde wissels van het trambedrijf kon omzetten. Vier trams ontspoorden en twaalf mensen raakten gewond.
  lesson:
    en: Field control channels without authentication are attack surface too, even when nothing is connected to a network.
    nl: Ook besturingskanalen in het veld zonder authenticatie horen bij het aanvalsoppervlak, zelfs zonder netwerkverbinding.
  sources:
    - {title: "Dark Reading: Teenage hacker takes over Polish tram system", url: "https://www.darkreading.com/perimeter/teenage-hacker-takes-over-polish-tram-system"}
    - {title: "RISI database entry", url: "https://www.risidata.com/Database/Detail/schoolboy_hacks_into_polish_tram_system"}

- id: btc-pipeline-2008
  date: "2008-08-05"
  name:
    en: Baku-Tbilisi-Ceyhan pipeline explosion
    nl: Explosie in de Bakoe-Tbilisi-Ceyhan-pijpleiding
  place: {en: "Refahiye, Turkey", nl: "Refahiye, Turkije"}
  lat: 39.9
  lon: 38.77
  continent: asia
  sector: oil_gas
  impact: process
  status: disputed
  actor: {en: "Russia, according to unnamed US officials in a 2014 report; the PKK claimed the blast; Turkey cited a technical failure", nl: "Rusland volgens anonieme Amerikaanse bronnen (2014); de PKK eiste de explosie op; Turkije sprak van een technisch defect"}
  summary:
    en: An explosion and fire hit a valve station of the BTC oil pipeline days before the Russia-Georgia war. A 2014 report claimed attackers had raised the pressure and suppressed alarms through the network, but no technical evidence was published and later analyses doubt the cyber explanation.
    nl: Bij een afsluiterstation van de BTC-oliepijpleiding brak kort voor de Russisch-Georgische oorlog een explosie en brand uit. Een rapport uit 2014 stelde dat aanvallers via het netwerk de druk hadden opgevoerd en alarmen onderdrukt, maar technisch bewijs is nooit gepubliceerd en latere analyses betwijfelen de cyberverklaring.
  lesson:
    en: Separate claims from evidence. Without logs and forensics nobody can prove what caused a process upset.
    nl: Scheid claims van bewijs. Zonder logging en forensisch onderzoek kan niemand aantonen wat een procesverstoring veroorzaakte.
  sources:
    - {title: "Eurasianet: US intelligence says Russia sabotaged BTC pipeline", url: "https://eurasianet.org/us-intelligence-russia-sabotaged-btc-pipeline-ahead-of-2008-georgia-war"}
    - {title: "New America: Closing the case on the reported BTC cyber attack", url: "https://www.newamerica.org/insights/closing-the-case-on-the-reported-2008-russian-cyber-attack-on-the-btc-pipeline-3/"}

- id: stuxnet-2010
  date: "2010-06"
  name:
    en: Stuxnet
    nl: Stuxnet
  place: {en: "Natanz, Iran", nl: "Natanz, Iran"}
  lat: 33.72
  lon: 51.73
  continent: asia
  sector: energy
  impact: process
  status: confirmed
  actor: {en: "Widely attributed to the United States and Israel; never officially confirmed", nl: "Breed toegeschreven aan de Verenigde Staten en Israël; nooit officieel bevestigd"}
  malware: [Stuxnet]
  summary:
    en: Discovered in June 2010, Stuxnet reprogrammed Siemens S7 controllers at the Natanz uranium enrichment plant to vary centrifuge speeds while operators saw recorded normal values. Earlier versions were active from 2007. It is the first known cyberweapon to cause physical damage.
    nl: Stuxnet werd in juni 2010 ontdekt en herprogrammeerde Siemens S7-controllers in de verrijkingsfabriek in Natanz, zodat centrifuges van toerental wisselden terwijl operators opgenomen normale waarden zagen. Eerdere versies waren al sinds 2007 actief. Het is het eerste bekende cyberwapen dat fysieke schade aanrichtte.
  lesson:
    en: An air gap is not a control on its own. Removable media and engineering workstations carried the attack in, and the HMI showed falsified values.
    nl: Een air gap is op zichzelf geen maatregel. Verwijderbare media en engineeringwerkstations brachten de aanval binnen, en de HMI toonde vervalste waarden.
  sources:
    - {title: "CCDCOE Cyber Law Toolkit: Stuxnet (2010)", url: "https://cyberlaw.ccdcoe.org/wiki/Stuxnet_(2010)"}
    - {title: "SecurityWeek: Symantec uncovers earliest known Stuxnet version", url: "https://www.securityweek.com/symantec-uncovers-earliest-known-version-stuxnet-dates-cyber-weapon-2005/amp/"}

- id: shamoon-2012
  date: "2012-08-15"
  name:
    en: Shamoon wiper at Saudi Aramco
    nl: Shamoon-wiper bij Saudi Aramco
  place: {en: "Dhahran, Saudi Arabia", nl: "Dhahran, Saoedi-Arabië"}
  lat: 26.29
  lon: 50.11
  continent: asia
  sector: oil_gas
  impact: disruption
  status: confirmed
  actor: {en: "Iran, according to US officials; claimed by 'Cutting Sword of Justice'", nl: "Iran volgens Amerikaanse functionarissen; opgeëist door 'Cutting Sword of Justice'"}
  malware: [Shamoon]
  summary:
    en: The Shamoon wiper erased about 30,000 workstations at the world's largest oil company, forcing weeks of paper-based business processes. Production was reported unaffected; Qatar's RasGas was hit days later.
    nl: De Shamoon-wiper wiste zo'n 30.000 werkplekken bij 's werelds grootste oliemaatschappij, waardoor bedrijfsprocessen wekenlang op papier liepen. De productie bleef volgens berichten draaien; het Qatarese RasGas werd enkele dagen later getroffen.
  lesson:
    en: Separation between IT and OT kept oil flowing. Plan how the plant keeps running while the office network is gone.
    nl: De scheiding tussen IT en OT hield de olie stromend. Plan hoe de installatie doordraait als het kantoornetwerk wegvalt.
  sources:
    - {title: "CCDCOE Cyber Law Toolkit: Shamoon (2012)", url: "https://cyberlaw.ccdcoe.org/wiki/Shamoon_(2012)"}
    - {title: "Dark Reading: 30,000 machines infected at Saudi Aramco", url: "https://www.darkreading.com/cyberattacks-data-breaches/30-000-machines-infected-in-targeted-attack-on-saudi-aramco"}

- id: bowman-dam-2013
  date: "2013-08"
  name:
    en: Bowman Avenue Dam
    nl: Bowman Avenue-stuwdam
  place: {en: "Rye Brook, New York, US", nl: "Rye Brook, New York, VS"}
  lat: 41.02
  lon: -73.68
  continent: north_america
  sector: water
  impact: intrusion
  status: confirmed
  actor: {en: "An Iranian national, charged by the US Department of Justice in 2016", nl: "Een Iraanse burger, in 2016 aangeklaagd door het Amerikaanse ministerie van Justitie"}
  summary:
    en: An intruder accessed the SCADA system of a small flood-control dam through a cellular modem and could read water levels and the status of the sluice gate. The gate had been disconnected for maintenance, so it could not be operated remotely.
    nl: Een indringer kwam via een mobiele modem in het SCADA-systeem van een kleine stuwdam en kon waterstanden en de stand van de schuif uitlezen. De schuif was voor onderhoud losgekoppeld en kon dus niet op afstand worden bediend.
  lesson:
    en: Small assets are reconnaissance targets too. Keep an inventory of every controller reachable over the internet or a cellular link.
    nl: Ook kleine assets zijn verkenningsdoelwit. Houd bij welke controllers via internet of een mobiele verbinding bereikbaar zijn.
  sources:
    - {title: "US Attorney SDNY: charges against seven Iranians", url: "https://www.justice.gov/usao-sdny/pr/manhattan-us-attorney-announces-charges-against-seven-iranians-conducting-coordinated"}
    - {title: "Help Net Security: Iranians indicted for attacks on banks and a dam", url: "https://www.helpnetsecurity.com/2016/03/24/7indicted-cyber-attacks-us-banks-dam/"}

- id: german-steel-mill-2014
  date: "2014-12"
  name:
    en: German steel mill blast furnace
    nl: Hoogoven van een Duitse staalfabriek
  place: {en: "Germany (site not disclosed)", nl: "Duitsland (locatie niet bekendgemaakt)"}
  lat: 51.2
  lon: 10.4
  continent: europe
  sector: manufacturing
  impact: process
  status: confirmed
  actor: {en: "Unknown", nl: "Onbekend"}
  summary:
    en: Germany's BSI reported that attackers used spear-phishing to reach a steel mill's office network and from there its production network. Control components failed so that a blast furnace could not be shut down in a controlled way, causing massive damage.
    nl: Het Duitse BSI meldde dat aanvallers via spearphishing in het kantoornetwerk van een staalfabriek kwamen en van daaruit in het productienetwerk. Besturingscomponenten vielen uit, waardoor een hoogoven niet gecontroleerd kon worden afgeschakeld, met grote schade tot gevolg.
  lesson:
    en: Phishing into IT, then pivot to OT, is the classic route. Zone boundaries and a safe state that holds when controls fail limit the damage.
    nl: Phishing in IT en dan doorsteken naar OT is de klassieke route. Zonegrenzen en een veilige toestand die standhoudt als besturing uitvalt, beperken de schade.
  sources:
    - {title: "WeLiveSecurity: Hackers damage German factory", url: "https://www.welivesecurity.com/2014/12/25/hackers-damage-german-factory/"}
    - {title: "SecurityWeek: Cyberattack on German steel plant causes significant damage", url: "https://www.securityweek.com/cyberattack-german-steel-plant-causes-significant-damage-report"}

- id: havex-2014
  date: "2014-06"
  name:
    en: Havex trojanised ICS vendor software
    nl: Havex in software van ICS-leveranciers
  place: {en: "Europe and the US (vendor sites in Belgium, Germany and Switzerland)", nl: "Europa en de VS (leveranciers in België, Duitsland en Zwitserland)"}
  lat: 50.6
  lon: 4.35
  continent: europe
  sector: cross_sector
  impact: intrusion
  status: confirmed
  actor: {en: "Dragonfly / Energetic Bear, linked to Russia", nl: "Dragonfly / Energetic Bear, gelinkt aan Rusland"}
  malware: [Havex]
  summary:
    en: The Dragonfly group replaced software installers on the websites of three ICS vendors, so energy and industrial customers installed a remote access trojan themselves. A Havex module scanned for OPC servers, mapping industrial networks in Europe and the US.
    nl: De Dragonfly-groep verving installatiebestanden op de websites van drie ICS-leveranciers, zodat klanten in energie en industrie zelf een remote access trojan installeerden. Een Havex-module zocht naar OPC-servers en bracht zo industriële netwerken in Europa en de VS in kaart.
  lesson:
    en: Verify vendor software (signatures, hashes) before it enters OT. The supply chain belongs in your zone and conduit model.
    nl: Controleer leveranciersoftware (handtekeningen, hashes) voordat die OT binnenkomt. De toeleveringsketen hoort in je zone- en conduitmodel.
  sources:
    - {title: "Netresec: Full disclosure of Havex trojans", url: "https://netresec.com/?b=14ABDA4"}
    - {title: "Wikipedia: Havex", url: "https://en.wikipedia.org/wiki/Havex"}

- id: ukraine-grid-2015
  date: "2015-12-23"
  name:
    en: Ukrainian power grid blackout
    nl: Stroomstoring in het Oekraïense net
  place: {en: "Ivano-Frankivsk and two other regions, Ukraine", nl: "Ivano-Frankivsk en twee andere regio's, Oekraïne"}
  lat: 48.92
  lon: 24.71
  continent: europe
  sector: energy
  impact: disruption
  status: confirmed
  actor: {en: "Sandworm (Russia's GRU), per US and UK governments", nl: "Sandworm (Russische GRU), volgens de Amerikaanse en Britse overheid"}
  malware: [BlackEnergy 3, KillDisk]
  summary:
    en: Attackers took over the SCADA systems of three regional distribution companies and opened breakers remotely, cutting power to about 225,000 customers for several hours. They also wiped systems, bricked serial-to-Ethernet gateways and flooded call centres.
    nl: Aanvallers namen de SCADA-systemen van drie regionale netbeheerders over en schakelden op afstand vermogensschakelaars uit, waardoor zo'n 225.000 klanten urenlang zonder stroom zaten. Ze wisten ook systemen, maakten serieel-naar-ethernetgateways onbruikbaar en bestookten callcenters.
  lesson:
    en: The attackers used legitimate remote access and the operators' own HMI. Strong authentication and monitoring of remote sessions matter more than malware signatures.
    nl: De aanvallers gebruikten legitieme remote access en de eigen HMI van de operators. Sterke authenticatie en monitoring van sessies op afstand wegen zwaarder dan malwaresignaturen.
  sources:
    - {title: "CISA ICS alert IR-ALERT-H-16-056-01", url: "https://cisa.gov/news-events/ics-alerts/ir-alert-h-16-056-01"}
    - {title: "E-ISAC and SANS: Analysis of the cyber attack on the Ukrainian power grid", url: "https://icscsi.org/library/Documents/Cyber_Events/E-ISAC%20-%20Analysis%20of%20the%20Cyber%20Attack%20on%20the%20Ukrainian%20Power%20Grid.pdf"}

- id: industroyer-2016
  date: "2016-12-17"
  name:
    en: Industroyer at a Kyiv substation
    nl: Industroyer bij een onderstation in Kyiv
  place: {en: "Kyiv, Ukraine", nl: "Kyiv, Oekraïne"}
  lat: 50.52
  lon: 30.55
  continent: europe
  sector: energy
  impact: disruption
  status: confirmed
  actor: {en: "Sandworm (Russia's GRU), per US and UK governments", nl: "Sandworm (Russische GRU), volgens de Amerikaanse en Britse overheid"}
  malware: [Industroyer, CrashOverride]
  summary:
    en: Malware that spoke grid protocols (IEC 60870-5-101 and 104, IEC 61850, OPC DA) opened breakers at a transmission substation north of Kyiv, causing an outage of about an hour. It was the first known malware built specifically to attack power grids.
    nl: Malware die netprotocollen sprak (IEC 60870-5-101 en 104, IEC 61850, OPC DA) opende vermogensschakelaars in een transmissiestation ten noorden van Kyiv, met een storing van ongeveer een uur. Het was de eerste bekende malware die speciaal voor aanvallen op stroomnetten was gebouwd.
  lesson:
    en: Industrial protocols without authentication accept any command. Detect unusual commands at protocol level, not only at the perimeter.
    nl: Industriële protocollen zonder authenticatie accepteren elk commando. Detecteer afwijkende commando's op protocolniveau, niet alleen aan de rand van het netwerk.
  sources:
    - {title: "Security Affairs: Industroyer linked to Ukraine power outage", url: "https://securityaffairs.com/59989/malware/industroyer-malware.html"}
    - {title: "eSecurity Planet: Malware behind Ukraine blackout analyzed", url: "https://esecurityplanet.com/?p=5289"}

- id: lappeenranta-2016
  date: "2016-11"
  name:
    en: Heating controllers knocked offline by DDoS
    nl: Verwarmingsregelingen plat door DDoS
  place: {en: "Lappeenranta, Finland", nl: "Lappeenranta, Finland"}
  lat: 61.06
  lon: 28.19
  continent: europe
  sector: building
  impact: disruption
  status: confirmed
  actor: {en: "Unknown", nl: "Onbekend"}
  summary:
    en: A DDoS attack hit internet-connected building automation in at least two apartment blocks. The heating controllers kept restarting and stopped heating and hot water while outside temperatures were below freezing.
    nl: Een DDoS-aanval trof via internet bereikbare gebouwautomatisering in minstens twee flatgebouwen. De verwarmingsregelingen bleven herstarten en stopten met verwarming en warm water terwijl het buiten vroor.
  lesson:
    en: Building automation is OT. Controllers should fail to a safe operating mode and should not be reachable directly from the internet.
    nl: Gebouwautomatisering is OT. Regelaars moeten terugvallen op een veilige stand en mogen niet rechtstreeks vanaf internet bereikbaar zijn.
  sources:
    - {title: "The Hacker News: DDoS attack takes down heating systems in Finland", url: "https://thehackernews.com/2016/11/heating-system-hacked.html"}
    - {title: "Security Affairs: DDoS knocks out building control systems in Finland", url: "https://securityaffairs.com/?p=53247"}

- id: wannacry-2017
  date: "2017-05-12"
  name:
    en: WannaCry halts car plants
    nl: WannaCry legt autofabrieken stil
  place: {en: "Sandouville, France, and plants worldwide", nl: "Sandouville, Frankrijk, en fabrieken wereldwijd"}
  lat: 49.5
  lon: 0.3
  continent: europe
  sector: manufacturing
  impact: disruption
  status: confirmed
  actor: {en: "Lazarus Group (North Korea), per US and UK governments", nl: "Lazarus Group (Noord-Korea), volgens de Amerikaanse en Britse overheid"}
  malware: [WannaCry]
  summary:
    en: The WannaCry worm spread through the SMBv1 flaw EternalBlue to some 150 countries. Renault and Nissan stopped production at several plants, including Sandouville in France and Sunderland in the UK.
    nl: De WannaCry-worm verspreidde zich via de SMBv1-kwetsbaarheid EternalBlue naar zo'n 150 landen. Renault en Nissan legden de productie in meerdere fabrieken stil, waaronder Sandouville in Frankrijk en Sunderland in het VK.
  lesson:
    en: Legacy Windows in production needs compensating controls when patching is not possible. Disable SMBv1, segment and monitor.
    nl: Verouderde Windows-systemen in de productie hebben compenserende maatregelen nodig als patchen niet kan. Zet SMBv1 uit, segmenteer en monitor.
  sources:
    - {title: "Automotive News Europe: Renault-Nissan resume production after cyberattack", url: "https://europe.autonews.com/article/20170514/ANE/170519877/renault-nissan-resume-nearly-all-production-after-cyberattack"}

- id: notpetya-2017
  date: "2017-06-27"
  name:
    en: NotPetya
    nl: NotPetya
  place: {en: "Ukraine, then worldwide", nl: "Oekraïne, daarna wereldwijd"}
  lat: 50.45
  lon: 30.52
  continent: europe
  sector: transport
  impact: disruption
  status: confirmed
  actor: {en: "Russian military (Sandworm), per the US, UK and other governments", nl: "Russisch leger (Sandworm), volgens de VS, het VK en andere landen"}
  malware: [NotPetya]
  summary:
    en: Spread through a poisoned update of Ukrainian accounting software, NotPetya destroyed systems at companies worldwide. Maersk's container terminals came to a standstill, Merck and Mondelez lost production, and radiation monitoring at Chornobyl switched to manual.
    nl: Via een besmette update van Oekraïense boekhoudsoftware vernietigde NotPetya systemen bij bedrijven over de hele wereld. Containerterminals van Maersk lagen stil, Merck en Mondelez verloren productie en de stralingsmeting bij Tsjernobyl ging over op handmatig.
  lesson:
    en: A flat network lets a worm reach everything. Segmentation and offline backups decided how fast companies recovered.
    nl: In een plat netwerk bereikt een worm alles. Segmentatie en offline back-ups bepaalden hoe snel bedrijven herstelden.
  sources:
    - {title: "Axios: White House confirms NotPetya was a Russian military operation", url: "https://www.axios.com/2018/02/15/white-house-confirms-notpetya-1518728781"}
    - {title: "Control Engineering: How NotPetya took down Maersk", url: "https://www.controleng.com/throwback-attack-how-notpetya-accidentally-took-down-global-shipping-giant-maersk"}

- id: triton-2017
  date: "2017-08"
  name:
    en: TRITON safety system attack
    nl: TRITON-aanval op een veiligheidssysteem
  place: {en: "Saudi Arabia (petrochemical plant)", nl: "Saoedi-Arabië (petrochemische fabriek)"}
  lat: 22.8
  lon: 39.03
  continent: asia
  sector: chemical
  impact: process
  status: confirmed
  actor: {en: "TEMP.Veles / XENOTIME; linked to Russia's CNIIHM institute, sanctioned by the US Treasury in 2020", nl: "TEMP.Veles / XENOTIME; gelinkt aan het Russische instituut CNIIHM, in 2020 gesanctioneerd door het Amerikaanse ministerie van Financiën"}
  malware: [TRITON, TRISIS]
  summary:
    en: Attackers reached the Triconex safety instrumented system of a petrochemical plant and tried to reprogram its controllers. A flaw in their code tripped the plant to a safe shutdown, which exposed the intrusion. It was the first known attack on a system built to protect human life.
    nl: Aanvallers kwamen bij het Triconex-veiligheidssysteem (SIS) van een petrochemische fabriek en probeerden de controllers te herprogrammeren. Een fout in hun code bracht de fabriek in een veilige stop, waardoor de inbraak aan het licht kwam. Het was de eerste bekende aanval op een systeem dat mensenlevens moet beschermen.
  lesson:
    en: Give the SIS its own zone, keep the key switch out of PROGRAM, and monitor every engineering connection to it.
    nl: Geef het SIS een eigen zone, laat de sleutelschakelaar niet op PROGRAM staan en monitor elke engineeringverbinding ermee.
  sources:
    - {title: "RISI database: TRITON/TRISIS Saudi petrochemical attack", url: "https://www.risidata.com/Database/Detail/triton-trisis-saudi-petrochemical-attack"}
    - {title: "Black Hat USA 2018 white paper: TRITON", url: "https://i.blackhat.com/us-18/Wed-August-8/us-18-Carcano-TRITON-How-It-Disrupted-Safety-Systems-And-Changed-The-Threat-Landscape-Of-Industrial-Control-Systems-Forever-wp.pdf"}

- id: us-grid-recon-2018
  date: "2018-03-15"
  name:
    en: Russian access to US energy control rooms
    nl: Russische toegang tot Amerikaanse energiecontrolekamers
  place: {en: "United States", nl: "Verenigde Staten"}
  lat: 38.9
  lon: -77.04
  continent: north_america
  sector: energy
  impact: intrusion
  status: confirmed
  actor: {en: "Russian government (Dragonfly 2.0), per DHS and FBI", nl: "Russische overheid (Dragonfly 2.0), volgens DHS en FBI"}
  summary:
    en: DHS and the FBI warned that Russian government actors had entered networks of energy and other critical infrastructure companies, reaching control-room workstations and collecting information about ICS. Trusted third parties and spear-phishing were the main way in.
    nl: DHS en de FBI waarschuwden dat Russische overheidsactoren in netwerken van energie- en andere vitale bedrijven zaten, tot op werkstations in controlekamers, en informatie over ICS verzamelden. Vertrouwde derde partijen en spearphishing waren de belangrijkste ingang.
  lesson:
    en: Supplier and integrator access is a common path into OT. Limit it, log it and review it.
    nl: Toegang van leveranciers en integrators is een veelgebruikte route naar OT. Beperk die, log die en beoordeel die.
  sources:
    - {title: "Security Affairs: DHS and FBI accuse Russia of hacking US critical infrastructure", url: "https://securityaffairs.com/70462/apt/russia-hack-critical-infrastructure.html"}
    - {title: "ARC Advisory Group: US-CERT warns on Russian state-sponsored attacks", url: "https://www.arcweb.com/blog/us-cert-warns-russian-government-sponsored-cyber-attacks"}

- id: tsmc-2018
  date: "2018-08-03"
  name:
    en: WannaCry variant stops TSMC fabs
    nl: WannaCry-variant legt fabs van TSMC stil
  place: {en: "Hsinchu, Taiwan", nl: "Hsinchu, Taiwan"}
  lat: 24.78
  lon: 120.99
  continent: asia
  sector: manufacturing
  impact: disruption
  status: confirmed
  actor: {en: "None: accidental infection", nl: "Geen: onbedoelde besmetting"}
  malware: [WannaCry]
  summary:
    en: A WannaCry variant entered TSMC's chip fabs when a new tool was installed without a malware scan. Several fabs in Taiwan were disrupted for days and TSMC put the cost at around 3 percent of quarterly revenue.
    nl: Een WannaCry-variant kwam de chipfabrieken van TSMC binnen toen een nieuwe machine werd geïnstalleerd zonder malwarescan. Meerdere fabs in Taiwan lagen dagen verstoord en TSMC schatte de schade op ongeveer 3 procent van de kwartaalomzet.
  lesson:
    en: New equipment and service laptops are an attack path. Scan and quarantine before anything joins the production network.
    nl: Nieuwe apparatuur en servicelaptops zijn een aanvalsroute. Scan en zet in quarantaine voordat iets op het productienetwerk komt.
  sources:
    - {title: "Engadget: TSMC says WannaCry variant shut down its plants", url: "https://www.engadget.com/2018-08-06-tsmc-wannacry-virus-shut-down-plants.html"}
    - {title: "WeLiveSecurity: Apple chip supplier blames WannaCryptor variant", url: "https://www.welivesecurity.com/2018/08/07/apple-chip-wannacryptor-shutdowns/"}

- id: spower-2019
  date: "2019-03-05"
  name:
    en: Firewall reboots blind a renewables operator
    nl: Herstartende firewalls verblinden duurzame-energiebedrijf
  place: {en: "Utah, US", nl: "Utah, VS"}
  lat: 40.76
  lon: -111.89
  continent: north_america
  sector: energy
  impact: disruption
  status: confirmed
  actor: {en: "Unknown", nl: "Onbekend"}
  summary:
    en: Attackers exploited a known flaw in Cisco firewalls at renewable energy company sPower, making them reboot repeatedly for about ten hours. The control centre lost contact with wind and solar sites for minutes at a time, while generation continued. It was the first reported cyber event to disrupt US grid operations.
    nl: Aanvallers misbruikten een bekende kwetsbaarheid in Cisco-firewalls bij het duurzame-energiebedrijf sPower, waardoor die ongeveer tien uur lang bleven herstarten. De meldkamer verloor telkens enkele minuten het contact met wind- en zonneparken; de opwek ging door. Het was de eerste gemelde cybergebeurtenis die Amerikaanse netoperaties verstoorde.
  lesson:
    en: Boundary devices are the doors to OT. Patch them first.
    nl: Grensapparatuur is de voordeur van OT. Patch die als eerste.
  sources:
    - {title: "CyberScoop: Utah renewables company hit by rare cyberattack", url: "https://cyberscoop.com/spower-power-grid-cyberattack-foia/"}
    - {title: "pv magazine USA: Solar power denial of service attack", url: "https://pv-magazine-usa.com/2019/11/01/mo-megawatts-mo-problems-solar-power-denial-of-service-attack/"}

- id: norsk-hydro-2019
