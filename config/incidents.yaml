  malware: [Dtrack]
  summary:
    en: India's nuclear operator NPCIL confirmed that Dtrack malware was found on a PC in the plant's administrative network. The plant control systems were isolated and not affected.
    nl: De Indiase kernenergiemaatschappij NPCIL bevestigde dat Dtrack-malware op een pc in het administratieve netwerk van de centrale was gevonden. De besturingssystemen van de centrale waren gescheiden en bleven onaangetast.
