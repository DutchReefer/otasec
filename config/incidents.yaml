    nl: Kleine Britse centrale vier dagen plat
  place: {en: "United Kingdom (site not disclosed)", nl: "Verenigd Koninkrijk (locatie niet bekendgemaakt)"}
  lat: 54.0
  lon: -2.0
  continent: europe
  sector: energy
  impact: disruption
  status: reported
  actor: {en: "Iran-linked hackers, according to press reports; no formal attribution", nl: "Aan Iran gelinkte hackers, volgens persberichten; geen formele toeschrijving"}
  summary:
    en: According to the Sunday Telegraph, a cyberattack shut down a small-scale power generator for four days while staff restored it. The UK government said there was no risk to the wider energy system.
