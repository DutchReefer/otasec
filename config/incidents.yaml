  date: "2022-02-24"
  name:
    en: KA-SAT outage cuts wind turbine monitoring
    nl: KA-SAT-storing raakt monitoring van windturbines
  place: {en: "Germany (Enercon) and across Europe", nl: "Duitsland (Enercon) en elders in Europa"}
  lat: 53.47
  lon: 7.48
  continent: europe
  sector: energy
  impact: disruption
  status: confirmed
  actor: {en: "Russia, per the EU, UK and US", nl: "Rusland, volgens de EU, het VK en de VS"}
  malware: [AcidRain]
  summary:
    en: An hour before the invasion of Ukraine, an attack on Viasat's KA-SAT network disabled tens of thousands of satellite modems. As collateral damage, Enercon lost remote monitoring and control of about 5,800 wind turbines (11 GW) in Germany; the turbines kept generating.
    nl: Een uur voor de inval in Oekraïne schakelde een aanval op het KA-SAT-netwerk van Viasat tienduizenden satellietmodems uit. Als nevenschade verloor Enercon de monitoring en bediening op afstand van zo'n 5.800 windturbines (11 GW) in Duitsland; de turbines bleven wel produceren.
  lesson:
    en: Know which third-party communication links your OT depends on (satellite, cellular) and plan for their loss.
    nl: Weet van welke communicatieverbindingen van derden je OT afhankelijk is (satelliet, mobiel) en plan voor uitval ervan.
  sources:
    - {title: "pv magazine: Satellite cyber attack paralyzes 11 GW of German wind turbines", url: "https://pv-magazine.com/2022/03/01/satellite-cyber-attack-paralyzes-11gw-of-german-wind-turbines"}
    - {title: "DatacenterDynamics: Satellite outage impacts more than 5,000 wind turbines", url: "https://www.datacenterdynamics.com/en/news/satellite-outage-impacts-more-than-5000-wind-turbines-across-europe/"}

- id: industroyer2-2022
  date: "2022-04-08"
  name:
    en: Industroyer2 stopped before execution
    nl: Industroyer2 gestopt voor uitvoering
  place: {en: "Ukraine (regional energy company)", nl: "Oekraïne (regionaal energiebedrijf)"}
  lat: 49.6
  lon: 32.0
  continent: europe
  sector: energy
  impact: intrusion
  status: confirmed
  actor: {en: "Sandworm, per CERT-UA and ESET", nl: "Sandworm, volgens CERT-UA en ESET"}
  malware: [Industroyer2, CaddyWiper]
  summary:
    en: Sandworm planned to switch off high-voltage substations of a Ukrainian energy company using Industroyer2, which speaks IEC 60870-5-104, and then wipe systems. CERT-UA and ESET detected and stopped the attack before it ran.
    nl: Sandworm wilde hoogspanningsstations van een Oekraïens energiebedrijf uitschakelen met Industroyer2, dat IEC 60870-5-104 spreekt, en daarna systemen wissen. CERT-UA en ESET ontdekten en stopten de aanval voordat die werd uitgevoerd.
  lesson:
    en: Detection and response capacity inside OT can stop even a prepared state attack.
    nl: Detectie- en responscapaciteit binnen OT kan zelfs een voorbereide statelijke aanval stoppen.
  sources:
    - {title: "WeLiveSecurity: Industroyer2, Industroyer reloaded", url: "https://welivesecurity.com/2022/04/12/industroyer2-industroyer-reloaded/"}
    - {title: "The Hacker News: Russian hackers tried attacking Ukraine's power grid", url: "https://thehackernews.com/2022/04/russian-hackers-tried-attacking.html"}

- id: khuzestan-steel-2022
  date: "2022-06-27"
  name:
    en: Fire at Khuzestan Steel
    nl: Brand bij Khuzestan Steel
  place: {en: "Ahvaz, Iran", nl: "Ahvaz, Iran"}
  lat: 31.32
  lon: 48.67
  continent: asia
  sector: manufacturing
  impact: process
  status: confirmed
  actor: {en: "Predatory Sparrow (claimed)", nl: "Predatory Sparrow (opgeëist)"}
  summary:
    en: The group attacked three Iranian steel makers and released CCTV footage of a machine spilling molten steel and starting a fire at Khuzestan Steel. The group said it had acted with care to avoid harming people.
    nl: De groep viel drie Iraanse staalbedrijven aan en publiceerde camerabeelden waarop een machine bij Khuzestan Steel gesmolten staal morst en brand veroorzaakt. Volgens de groep werd zorgvuldig gehandeld om geen mensen te raken.
  lesson:
    en: Process safety and cyber security meet here. Hazard analyses (HAZOP, LOPA) should include deliberate manipulation.
    nl: Hier komen procesveiligheid en cybersecurity samen. Risicoanalyses (HAZOP, LOPA) moeten ook bewuste manipulatie meenemen.
  sources:
    - {title: "GovInfoSecurity: Iranian steelmaker halts production after cyberattack", url: "https://www.govinfosecurity.com/iranian-steelmaker-halts-production-following-cyberattack-a-19465"}
    - {title: "GovInfoSecurity: Predatory Sparrow's hacks", url: "https://www.govinfosecurity.com/predatory-sparrows-hacks-theres-smoke-theres-fire-a-19551"}

- id: ukraine-microscada-2022
  date: "2022-10-10"
  name:
    en: Sandworm trips breakers via MicroSCADA
    nl: Sandworm schakelt via MicroSCADA
  place: {en: "Ukraine (site not disclosed)", nl: "Oekraïne (locatie niet bekendgemaakt)"}
  lat: 49.2
  lon: 28.5
  continent: europe
  sector: energy
  impact: disruption
  status: confirmed
  actor: {en: "Sandworm, per Mandiant", nl: "Sandworm, volgens Mandiant"}
  malware: [CaddyWiper]
  summary:
    en: Using living-off-the-land techniques, the attackers ran commands through a substation's MicroSCADA system to open breakers, causing an outage that coincided with Russian missile strikes. Two days later they deployed a wiper. Mandiant disclosed the case in November 2023.
    nl: Met living-off-the-land-technieken gaven de aanvallers via het MicroSCADA-systeem van een onderstation opdrachten om schakelaars te openen, wat een stroomstoring gaf die samenviel met Russische raketaanvallen. Twee dagen later zetten ze een wiper in. Mandiant maakte de zaak in november 2023 bekend.
  lesson:
    en: Attackers increasingly use the vendor's own tools. Watch for unusual use of legitimate engineering functions.
    nl: Aanvallers gebruiken steeds vaker de eigen tools van de leverancier. Let op ongebruikelijk gebruik van legitieme engineeringfuncties.
  sources:
    - {title: "The Hacker News: Sandworm caused power outage in Ukraine", url: "https://thehackernews.com/2023/11/russian-hackers-sandworm-cause-power.html"}
    - {title: "Help Net Security: Sandworm incapacitated Ukrainian power grid", url: "https://www.helpnetsecurity.com/2023/11/09/ukrainian-power-grid-disruption/"}

- id: denmark-energy-2023
  date: "2023-05-11"
  name:
    en: 22 Danish energy companies breached
    nl: 22 Deense energiebedrijven binnengedrongen
  place: {en: "Denmark", nl: "Denemarken"}
  lat: 56.0
  lon: 9.5
  continent: europe
  sector: energy
  impact: intrusion
  status: confirmed
  actor: {en: "Unknown; SektorCERT saw some indicators linked to Sandworm", nl: "Onbekend; SektorCERT zag enkele indicatoren die naar Sandworm wijzen"}
  summary:
    en: Attackers exploited a critical vulnerability in Zyxel firewalls to compromise 22 Danish energy companies in a coordinated campaign. Several companies switched to island mode, cutting their connection to the internet. SektorCERT called it the largest attack on Danish critical infrastructure so far.
    nl: Aanvallers misbruikten een kritieke kwetsbaarheid in Zyxel-firewalls om in een gecoördineerde campagne 22 Deense energiebedrijven binnen te dringen. Meerdere bedrijven gingen in eilandbedrijf en verbraken de verbinding met internet. SektorCERT noemde het de grootste aanval op Deense vitale infrastructuur tot dan toe.
  lesson:
    en: A sector CERT with sensors across members saw the pattern fast. Shared monitoring pays off for small operators.
    nl: Een sector-CERT met sensoren bij de leden zag het patroon snel. Gedeelde monitoring loont voor kleine bedrijven.
  sources:
    - {title: "SecurityWeek: 22 energy firms hacked in Denmark", url: "https://www.securityweek.com/22-energy-firms-hacked-in-largest-coordinated-attack-on-denmarks-critical-infrastructure/"}
    - {title: "The Register: Inside Denmark's hell week", url: "https://www.theregister.com/2023/11/13/inside_denmarks_hell_week_as/"}

- id: volt-typhoon-2023
  date: "2023-05-24"
  name:
    en: Volt Typhoon pre-positioning
    nl: Voorpositionering door Volt Typhoon
  place: {en: "Guam and the United States", nl: "Guam en de Verenigde Staten"}
  lat: 13.44
  lon: 144.79
  continent: oceania
  sector: cross_sector
  impact: intrusion
  status: confirmed
  actor: {en: "Volt Typhoon (China state-sponsored), per the US and allied governments", nl: "Volt Typhoon (Chinese staat), volgens de VS en bondgenoten"}
  summary:
    en: Microsoft and Five Eyes agencies disclosed that Volt Typhoon had compromised critical infrastructure in Guam and the US, including communications, energy, water and transport. In 2024 CISA assessed the goal as pre-positioning for disruptive attacks, with some access lasting at least five years.
    nl: Microsoft en de Five Eyes-diensten maakten bekend dat Volt Typhoon vitale infrastructuur op Guam en in de VS was binnengedrongen, waaronder communicatie, energie, water en transport. In 2024 concludeerde CISA dat het doel voorpositionering voor verstorende aanvallen was, met toegang die soms minstens vijf jaar duurde.
  lesson:
    en: Living-off-the-land intrusions leave few traces. Baseline normal behaviour in OT networks so deviations stand out.
    nl: Inbraken met living-off-the-land-technieken laten weinig sporen na. Leg normaal gedrag in OT-netwerken vast, zodat afwijkingen opvallen.
  sources:
    - {title: "CISA advisory AA24-038A", url: "https://cisa.gov/news-events/cybersecurity-advisories/aa24-038a"}
    - {title: "Australian Cyber Security Centre: PRC actors maintain access to US critical infrastructure", url: "https://www.cyber.gov.au/about-us/view-all-content/alerts-and-advisories/prc-state-sponsored-actors-compromise-and-maintain-persistent-access-us-critical-infrastructure"}

- id: nagoya-port-2023
  date: "2023-07-04"
  name:
    en: LockBit at the Port of Nagoya
    nl: LockBit in de haven van Nagoya
  place: {en: "Nagoya, Japan", nl: "Nagoya, Japan"}
  lat: 35.09
  lon: 136.88
  continent: asia
  sector: transport
  impact: disruption
  status: confirmed
  actor: {en: "LockBit (claimed)", nl: "LockBit (opgeëist)"}
  malware: [LockBit]
  summary:
    en: Ransomware hit the terminal operating system of Japan's busiest port by cargo volume, halting container handling for about two and a half days.
    nl: Ransomware trof het terminalsysteem van Japans drukste vrachthaven, waardoor de containeroverslag ongeveer tweeënhalve dag stillag.
  lesson:
    en: A single shared terminal system can stop a whole port. Design for redundancy and fast restore.
    nl: Eén gedeeld terminalsysteem kan een hele haven stilleggen. Ontwerp op redundantie en snel herstel.
  sources:
    - {title: "Dark Reading: Ransomware halts operations at Japan's Port of Nagoya", url: "https://www.darkreading.com/cyberattacks-data-breaches/ransomware-halts-operations-at-japan-port-of-nagoya"}
    - {title: "The Maritime Executive: Ransomware stops container operations at Nagoya", url: "https://maritime-executive.com/article/ransomware-attack-stops-container-operations-japan-s-nagoya-port"}

- id: dp-world-australia-2023
  date: "2023-11-10"
  name:
    en: DP World Australia ports
    nl: Havens van DP World Australia
  place: {en: "Sydney, Melbourne, Brisbane and Fremantle, Australia", nl: "Sydney, Melbourne, Brisbane en Fremantle, Australië"}
  lat: -33.97
  lon: 151.21
  continent: oceania
  sector: transport
  impact: disruption
  status: confirmed
  actor: {en: "Unknown", nl: "Onbekend"}
  summary:
    en: A cyber incident forced DP World Australia to disconnect its systems from the internet, stopping trucks from collecting or delivering containers at four major terminals for about three days. A backlog of tens of thousands of containers followed.
    nl: Door een cyberincident moest DP World Australia zijn systemen van internet loskoppelen, waardoor vrachtwagens ongeveer drie dagen geen containers konden ophalen of afleveren bij vier grote terminals. Er ontstond een achterstand van tienduizenden containers.
  lesson:
    en: Disconnecting is a valid containment choice; know in advance what still works when you do.
    nl: Loskoppelen is een valide inperkingsmaatregel; weet vooraf wat dan nog werkt.
  sources:
    - {title: "The Record: Australian ports operator recovering after cyber incident", url: "https://therecord.media/australian-ports-operator-recovering-from-large-cyber-incident"}
    - {title: "Industrial Cyber: DP World Australia disruption", url: "https://industrialcyber.co/news/cyber-adversaries-strike-dp-world-australia-disrupting-transportation-of-goods-to-and-from-country/"}

- id: aliquippa-2023
  date: "2023-11-25"
  name:
    en: Unitronics PLC at Aliquippa water authority
    nl: Unitronics-PLC bij waterbedrijf Aliquippa
  place: {en: "Aliquippa, Pennsylvania, US", nl: "Aliquippa, Pennsylvania, VS"}
  lat: 40.62
  lon: -80.25
  continent: north_america
  sector: water
  impact: disruption
  status: confirmed
  actor: {en: "CyberAv3ngers, linked to Iran's IRGC by the US government", nl: "CyberAv3ngers, door de Amerikaanse overheid gelinkt aan de Iraanse IRGC"}
  summary:
    en: The group took over an internet-exposed Unitronics PLC at a booster station that controls water pressure and defaced its screen. The station was run manually; water supply was not at risk. The same group hit Unitronics PLCs in several countries using the default password.
    nl: De groep nam een via internet bereikbare Unitronics-PLC over bij een drukverhogingsstation en bekladde het scherm. Het station werd handmatig bediend; de watervoorziening kwam niet in gevaar. Dezelfde groep trof Unitronics-PLC's in meerdere landen via het standaardwachtwoord.
  lesson:
    en: Change default passwords and never put a PLC directly on the internet.
    nl: Wijzig standaardwachtwoorden en zet een PLC nooit rechtstreeks op internet.
  sources:
    - {title: "Claroty Team82: Hacktivists target PLCs at US water facility", url: "https://claroty.com/team82/blog/opportunistic-hacktivists-target-plcs-at-us-water-facility"}
    - {title: "The Hacker News: Iranian hackers exploit PLCs in attack", url: "https://thehackernews.com/2023/11/iranian-hackers-exploit-plcs-in-attack.html"}

- id: erris-water-2023
  date: "2023-12-06"
  name:
    en: Water cut off in Erris
    nl: Water afgesloten in Erris
  place: {en: "Erris, County Mayo, Ireland", nl: "Erris, County Mayo, Ierland"}
  lat: 54.2
  lon: -9.9
  continent: europe
  sector: water
  impact: disruption
  status: confirmed
  actor: {en: "Pro-Iranian hacktivists, in line with the CyberAv3ngers campaign", nl: "Pro-Iraanse hacktivisten, passend bij de CyberAv3ngers-campagne"}
  summary:
    en: Attackers compromised an Israeli-made Unitronics PLC at a pumping station of a local water scheme, leaving about 180 homes without water for two days.
    nl: Aanvallers namen een in Israël gemaakte Unitronics-PLC over bij een pompstation van een lokale watervoorziening, waardoor zo'n 180 huishoudens twee dagen zonder water zaten.
  lesson:
    en: Small operators are hit by the same mass campaigns as large ones. Basic hygiene closes most of the door.
    nl: Kleine beheerders worden door dezelfde massacampagnes geraakt als grote. Basishygiëne sluit de deur grotendeels.
  sources:
    - {title: "The Record: Water outage in County Mayo after cyberattack", url: "https://therecord.media/water-outage-in-ireland-county-mayo"}
    - {title: "SecurityWeek: Cyberattack on Irish utility cuts off water for two days", url: "https://www.securityweek.com/cyberattack-on-irish-utility-cuts-off-water-supply-for-two-days/"}

- id: frostygoop-2024
  date: "2024-01"
  name:
    en: FrostyGoop cuts heating in Lviv
    nl: FrostyGoop legt verwarming in Lviv plat
  place: {en: "Lviv, Ukraine", nl: "Lviv, Oekraïne"}
  lat: 49.84
  lon: 24.03
  continent: europe
  sector: energy
  impact: process
  status: confirmed
  actor: {en: "Unknown (disclosed by Dragos)", nl: "Onbekend (bekendgemaakt door Dragos)"}
  malware: [FrostyGoop]
  summary:
    en: Malware sent Modbus TCP commands to heating controllers of a municipal district heating company, leaving more than 600 apartment buildings without heating for almost two days in sub-zero temperatures. Dragos disclosed the case in July 2024.
    nl: Malware stuurde Modbus TCP-commando's naar regelaars van een gemeentelijk warmtebedrijf, waardoor meer dan 600 flatgebouwen bijna twee dagen zonder verwarming zaten bij temperaturen onder nul. Dragos maakte het in juli 2024 bekend.
  lesson:
    en: Modbus has no authentication. Do not expose it, and filter and monitor which hosts may send write commands.
    nl: Modbus kent geen authenticatie. Stel het niet bloot en filter en monitor welke hosts schrijfcommando's mogen sturen.
  sources:
    - {title: "MITRE ATT&CK: FrostyGoop (S1165)", url: "https://attack.mitre.org/software/S1165"}
    - {title: "SoS VO: FrostyGoop left residents without heating", url: "https://sos-vo.org/node/108032"}

- id: muleshoe-2024
  date: "2024-01-18"
  name:
    en: Water tank overflow in Muleshoe
    nl: Overlopende watertank in Muleshoe
  place: {en: "Muleshoe, Texas, US", nl: "Muleshoe, Texas, VS"}
  lat: 34.23
  lon: -102.72
  continent: north_america
  sector: water
  impact: process
  status: confirmed
  actor: {en: "Cyber Army of Russia Reborn (claimed); linked to Sandworm by Mandiant; two members sanctioned by the US Treasury", nl: "Cyber Army of Russia Reborn (opgeëist); door Mandiant gelinkt aan Sandworm; twee leden gesanctioneerd door het Amerikaanse ministerie van Financiën"}
  summary:
    en: Attackers manipulated the internet-facing HMI of a small town's water system, causing a storage tank to overflow for 30 to 45 minutes until operators switched to manual. Nearby towns reported intrusion attempts in the same days.
    nl: Aanvallers manipuleerden de via internet bereikbare HMI van het waterbedrijf van een kleine stad, waardoor een opslagtank 30 tot 45 minuten overliep tot operators overschakelden op handbediening. Nabijgelegen plaatsen meldden in dezelfde dagen inbraakpogingen.
  lesson:
    en: An HMI on the internet is a control panel for anyone. Put remote access behind a VPN with MFA.
    nl: Een HMI op internet is een bedieningspaneel voor iedereen. Zet toegang op afstand achter een VPN met MFA.
  sources:
    - {title: "RISI database: Muleshoe water overflow", url: "https://www.risidata.com/Database/Detail/muleshoe-tx-sandworm-water-overflow-2024"}
    - {title: "CPO Magazine: Russian hackers linked to Texas water breach", url: "https://www.cpomagazine.com/cyber-security/state-sponsored-russian-hackers-linked-to-breach-of-texas-water-treatment-plant/"}

- id: varta-2024
  date: "2024-02-12"
  name:
    en: Varta battery plants halted
    nl: Batterijfabrieken van Varta stilgelegd
  place: {en: "Ellwangen, Germany", nl: "Ellwangen, Duitsland"}
  lat: 48.96
  lon: 10.13
  continent: europe
  sector: manufacturing
  impact: disruption
  status: confirmed
  actor: {en: "Unknown", nl: "Onbekend"}
  summary:
    en: A cyberattack forced battery maker Varta to shut down its IT systems as a precaution, halting production at its five plants and administration for weeks.
    nl: Na een cyberaanval moest batterijmaker Varta uit voorzorg zijn IT-systemen uitschakelen, waardoor productie in vijf fabrieken en de administratie wekenlang stillagen.
  lesson:
    en: A precautionary shutdown is only short if restore procedures for production systems are tested.
    nl: Een stillegging uit voorzorg blijft alleen kort als herstelprocedures voor productiesystemen getest zijn.
  sources:
    - {title: "BleepingComputer: Varta halts production after cyberattack", url: "https://www.bleepingcomputer.com/news/security/german-battery-maker-varta-halts-production-after-cyberattack/"}
    - {title: "Security Affairs: Cyberattack halted Varta production plants", url: "https://securityaffairs.com/159190/hacking/cyberattack-halted-varta-production-plants.html"}

- id: bremanger-dam-2025
  date: "2025-04-07"
  name:
    en: Dam outlet opened at Bremanger
    nl: Damafvoer geopend in Bremanger
  place: {en: "Bremanger, Norway", nl: "Bremanger, Noorwegen"}
  lat: 61.83
  lon: 5.1
  continent: europe
  sector: water
  impact: process
  status: confirmed
  actor: {en: "Pro-Russian hackers, per Norway's Police Security Service (August 2025)", nl: "Pro-Russische hackers, volgens de Noorse veiligheidsdienst PST (augustus 2025)"}
  summary:
    en: Attackers accessed the control system of a dam at Lake Risevatnet and opened an outlet, releasing about 500 litres per second for four hours before it was noticed. No one was hurt.
    nl: Aanvallers kwamen in het besturingssysteem van een dam bij het meer Risevatnet en openden een afvoer, waardoor vier uur lang zo'n 500 liter per seconde wegstroomde voordat het werd opgemerkt. Niemand raakte gewond.
  lesson:
    en: Four hours without noticing is the real finding. Alarm on unexpected changes in actuator positions.
    nl: Vier uur lang niets merken is de eigenlijke bevinding. Alarmeer op onverwachte veranderingen in klep- en schuifstanden.
  sources:
    - {title: "Wikipedia: Bremanger dam sabotage", url: "https://en.wikipedia.org/wiki/Bremanger_dam_sabotage"}
    - {title: "Security Affairs: Norway confirms dam intrusion by pro-Russian hackers", url: "https://securityaffairs.com/181143/hacktivism/norway-confirms-dam-intrusion-by-pro-russian-hackers.html"}

- id: tczew-hydro-2025
  date: "2025-08"
  name:
    en: Hydropower plant in Tczew
    nl: Waterkrachtcentrale in Tczew
  place: {en: "Tczew, Poland", nl: "Tczew, Polen"}
  lat: 54.09
  lon: 18.78
  continent: europe
  sector: energy
  impact: process
  status: reported
  actor: {en: "Russian hacktivists (claimed, with video)", nl: "Russische hacktivisten (opgeëist, met video)"}
  summary:
    en: Hacktivists published video of access to the control system of a small hydropower plant, first in May 2025 and again in August. Polish analysts concluded from turbine data that the second intrusion disrupted operations.
    nl: Hacktivisten publiceerden beelden van toegang tot het besturingssysteem van een kleine waterkrachtcentrale, eerst in mei 2025 en opnieuw in augustus. Poolse analisten concludeerden uit turbinedata dat de tweede inbraak de bedrijfsvoering verstoorde.
  lesson:
    en: After a first intrusion, assume the attacker will be back. Close the path, do not just reset the password.
    nl: Ga er na een eerste inbraak van uit dat de aanvaller terugkomt. Sluit de route af, reset niet alleen het wachtwoord.
  sources:
    - {title: "Dark Reading: Russian hacktivists target Polish power plant again", url: "https://www.darkreading.com/cyberattacks-data-breaches/russian-hacktivists-polish-power-plant-attack"}
    - {title: "SC Media: Russian cyberattack disrupts Polish hydropower plant anew", url: "https://www.scworld.com/brief/russian-cyberattack-disrupts-polish-hydropower-plant-anew"}

- id: jlr-2025
  date: "2025-09-01"
  name:
    en: Jaguar Land Rover production stop
    nl: Productiestop bij Jaguar Land Rover
  place: {en: "Solihull and other plants, United Kingdom", nl: "Solihull en andere fabrieken, Verenigd Koninkrijk"}
  lat: 52.41
  lon: -1.78
  continent: europe
  sector: manufacturing
  impact: disruption
  status: confirmed
  actor: {en: "Scattered Lapsus$ Hunters (claimed)", nl: "Scattered Lapsus$ Hunters (opgeëist)"}
  summary:
    en: A cyberattack forced JLR to shut down its systems and halt vehicle production for about five weeks. The Cyber Monitoring Centre estimated the cost to the UK economy at around 1.9 billion pounds, affecting more than 5,000 organisations in the supply chain.
    nl: Na een cyberaanval moest JLR zijn systemen uitschakelen en de autoproductie ongeveer vijf weken stilleggen. Het Cyber Monitoring Centre schatte de schade voor de Britse economie op zo'n 1,9 miljard pond, met gevolgen voor meer dan 5.000 organisaties in de keten.
  lesson:
    en: Just-in-time supply chains multiply the impact of one plant's downtime. Include suppliers in continuity planning.
    nl: Just-in-time-ketens vermenigvuldigen de impact van stilstand in één fabriek. Neem leveranciers mee in de continuïteitsplanning.
  sources:
