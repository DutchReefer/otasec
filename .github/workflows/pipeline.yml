name: OTASEC pipeline

# Hourly: fetch sources -> classify with Claude -> (once each morning) write the
# daily briefing -> build both sites -> commit data/ -> deploy over explicit FTPS.
#
# Security layout (least privilege):
#   build   - runs all code that touches untrusted input (feeds, X, CSAF, Claude
#             output) with a READ-ONLY token and no FTP credentials. Its only
#             output is an artifact with data/ and dist/.
#   publish - runs no project code. It commits data/ (needs contents: write) and
#             uploads dist/ (needs the FTP secrets).
# Actions are pinned to full commit SHAs (Dependabot keeps them current) and
# Python packages are installed from a hash-locked requirements.txt.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_briefing:
        description: "Regenerate today's briefing now"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: otasec-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install --require-hashes -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read-only in this job; used only for GitHub API calls (CISA CSAF lookup).
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force_briefing && '--force-briefing' || '' }}
        run: python -m otasec run $FORCE

      - name: Keep data and built site as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            data
            dist
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      SITE: ${{ github.workspace }}/../site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ github.workspace }}/../site

      - name: Check artifact
        run: |
          set -euo pipefail
          for d in data dist/en dist/nl; do
            test -d "$SITE/$d" || { echo "artifact is missing $d"; exit 1; }
          done
          # Only regular files and folders may be committed or uploaded.
          if find "$SITE" ! -type f ! -type d | grep -q .; then
            echo "artifact contains links or special files"; exit 1
          fi

      - name: Commit data
        run: |
          set -euo pipefail
          rm -rf data
          cp -R "$SITE/data" data
          git config user.name "otasec-bot"
          git config user.email "otasec-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -q -m "data: update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
            git push -q
          fi

      - name: Deploy
        if: env.FTP_HOST != ''
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR_EN: ${{ vars.FTP_DIR_EN }}
          FTP_DIR_NL: ${{ vars.FTP_DIR_NL }}
          FTP_DELETE: ${{ vars.FTP_DELETE || 'false' }}
        run: |
          set -euo pipefail
          for v in FTP_DIR_EN FTP_DIR_NL; do
            [[ "${!v}" =~ ^/?[A-Za-z0-9._/-]+$ ]] || { echo "Set repo variable $v to a plain path"; exit 1; }
          done
          [[ "$FTP_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "FTP_HOST must be a host name"; exit 1; }
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null
          DEL=""; [ "$FTP_DELETE" = "true" ] && DEL="--delete"
          # Explicit FTPS only: TLS for login and data, and GetHost's self-signed
          # certificate is pinned by its SHA-1 fingerprint (any other certificate
          # fails with "certificate is NOT trusted"; update the fingerprint when
          # GetHost renews it).
          lftp --env-password -u "$FTP_USER" "ftp://$FTP_HOST" -e "
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ftp:ssl-protect-list yes;
            set ssl:verify-certificate/AB:53:C4:34:26:DE:BD:C8:7F:F1:B9:A3:27:0E:28:6B:E2:20:77:35 no;
            set net:max-retries 3;
            set net:timeout 30;
            mirror -R $DEL --parallel=4 --no-symlinks --exclude-glob .well-known/ --exclude-glob cgi-bin/ '$SITE/dist/en' '$FTP_DIR_EN';
            mirror -R $DEL --parallel=4 --no-symlinks --exclude-glob .well-known/ --exclude-glob cgi-bin/ '$SITE/dist/nl' '$FTP_DIR_NL';
            bye"
