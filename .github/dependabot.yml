# Keeps the SHA-pinned GitHub Actions and the hash-locked Python packages
# current. Dependabot opens a pull request; the Tests workflow checks it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
